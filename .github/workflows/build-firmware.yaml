
# Build firmware for the Ender-3 V3 SE
name: Build Firmware

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup cache
        uses: actions/cache@v4
        with:
          path: ci_cache
          key: ${{ runner.os }}-build-${{ hashFiles('scripts/edited-ci-install.sh') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Prepare build
        run: ./scripts/edited-ci-install.sh

      - name: Build firmware
        run: ./scripts/edited-ci-build.sh 2>&1

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ender3-v3-se-klipper-firmware
          path: ci_build/output/*.bin
          if-no-files-found: error
